# mini2 — media stack (R5 2400GE Vega 11, headless, 16GB)
# Deploy: sudo docker compose -f /etc/stacks/media/compose.yaml up -d
# Requires: /mnt/storage mounted (ext4 STORAGE), .env next to this file (Mullvad)
# PUID/PGID 1000 = elias. Change if your user id differs (id -u / id -g).
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    ports:
      - 9091:9091  # transmission via VPN
      - 9696:9696  # prowlarr via VPN
      - 8989:8989  # sonarr via VPN
      - 7878:7878  # radarr via VPN
    volumes:
      - ./data/gluetun:/gluetun
    env_file: [.env]
    environment:
      - DNS_OVER_TLS=off
    healthcheck:
      test: ["CMD-SHELL", "wg show || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  transmission:
    <<: *common
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: "service:gluetun"
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data/transmission:/config
      - /mnt/storage/media/downloads:/downloads
      - /mnt/storage/media/downloads:/watch

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data/prowlarr:/config

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data/sonarr:/config
      - /mnt/storage/media/tv:/tv
      - /mnt/storage/media/downloads:/downloads

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun: { condition: service_healthy }
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data/radarr:/config
      - /mnt/storage/media/movies:/movies
      - /mnt/storage/media/downloads:/downloads

  jellyseerr:
    <<: *common
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    ports: ["5055:5055"]
    environment:
      - LOG_LEVEL=debug
      - TZ=America/New_York
    volumes:
      - ./data/jellyseerr:/app/config

  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports: ["8096:8096", "8920:8920"]
    devices: [/dev/dri:/dev/dri]  # Vega 11 VAAPI
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - /mnt/storage/media/tv:/media/tv:ro
      - /mnt/storage/media/movies:/media/movies:ro
      - /mnt/storage/media/music:/media/music:ro

  navidrome:
    <<: *common
    image: deluan/navidrome:latest
    container_name: navidrome
    ports: ["4533:4533"]
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
    volumes:
      - ./data/navidrome:/data
      - /mnt/storage/media/music:/music:ro

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg16-v0.3.0
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: immich
    volumes:
      - ./data/immich-postgres:/var/lib/postgresql/data

  immich-redis:
    image: redis:7
    container_name: immich-redis
    restart: unless-stopped

  immich:
    <<: *common
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    ports: ["2283:2283"]
    depends_on:
      - immich-postgres
      - immich-redis
    volumes:
      - ./data/immich:/usr/src/app/upload
      - /mnt/storage/media/photos:/usr/src/app/external:ro
    environment:
      - TZ=America/New_York
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
